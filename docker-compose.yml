version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: santiye360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--auth-host=trust"
    ports:
      - "55532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    shm_size: '128mb'

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/santiye360?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET .env dosyasinda tanimlanmali}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${NEXTAUTH_URL:-https://santiye360.org}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://santiye360.org}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      NODE_OPTIONS: "--max-old-space-size=512"
      PORT: 4000
    ports:
      - "4000:4000"
    deploy:
      resources:
        limits:
          memory: 1G
    command: ["node", "server.js"]

volumes:
  pgdata:
